# ===============
# Ink Theme Config
# ===============

# Site navigation menu
menu:
  首页: /
  归档: /archives
  分类: /categories
  标签: /tags

# RSS link (optional, leave empty to disable)
rss: /atom.xml

# Footer copyright (supports HTML)
copyright: '&copy; <span id="copyright-year"></span> <a href="/">欢蹦乱跳少年游</a>'

# Home page: number of posts per page
per_page: 10

# Table of contents
toc:
  enable: true
  # max depth of headings to show in TOC
  max_depth: 3

# Code highlighting (uses Hexo's built-in highlight.js)
highlight:
  enable: true
  theme: github-dark  # github | monokai | atom-one-dark | atom-one-light

# External links open in new tab
external_link: true

# ── Site-wide password gate ──
# Set to a non-empty string to require visitors to enter this password before
# the site content is revealed. Leave as empty string to disable the gate.
#
# ⚠️ Security: this is a static-site gate. The password (SHA-256 hashed) ends
# up in the published JS, so anyone who opens DevTools can find and brute-force
# it. Suitable for "keep strangers and crawlers out" use cases, NOT for keeping
# a determined attacker out. Use a value that's easy to share with 1-5 trusted
# people but not guessable.
site_password: "zhangwenze"
